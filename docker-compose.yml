services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
    env_file:
      - .env
    ports:
      - "80:8080"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/schema_migration.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
